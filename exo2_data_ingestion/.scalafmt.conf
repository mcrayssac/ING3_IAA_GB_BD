# Four-space indentation and 110-column lines. Existing line breaks and Scaladoc are kept,
# so formatting changes indentation and wraps only lines that exceed the limit.
version = "3.11.5"
runner.dialect = scala213
fileOverride {
    # sbt 2 build definitions use Scala 3 syntax.
    "glob:**/*.sbt" {
        runner.dialect = scala3
    }
}
project.git = true
maxColumn = 110
indent.main = 4
indent.callSite = 4
align.preset = none
newlines.source = keep
docstrings.style = SpaceAsterisk
docstrings.wrap = keep
docstrings.forceBlankLineBefore = false
