[project]
name = "nyc-taxi-prediction"
version = "0.1.0"
description = "Training and inference scripts for NYC taxi fare prediction."
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "flake8==7.3.0",
    "pyment==0.3.3",
    "pytest==9.1.1",
]

[tool.uv]
# Training and inference remain scripts, without a distribution build.
package = false
required-version = "==0.12.17"
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
