spark.hadoop.fs.s3a.endpoint http://rustfs:9000
spark.hadoop.fs.s3a.access.key rustfsadmin
spark.hadoop.fs.s3a.secret.key rustfsadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# apache/spark:4.2.0 ships no S3A implementation, so the settings above stay
# inert without this module. It is the dependency already declared in the exo
# build.sbt files. The image home directory is not writable, so Ivy resolves
# into the container temporary directory.
spark.jars.packages org.apache.spark:spark-hadoop-cloud_2.13:4.2.0
spark.jars.ivy /tmp/.ivy
